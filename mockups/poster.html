<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ParkFlung · proposta manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #1d2a44; --paper: #f6ecd8; --coral: #e8664a; --teal: #1f7a80; --mustard: #e9b13a; --olive: #6f8f3d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Work Sans', sans-serif; }
  .phone { max-width: 375px; margin: 0 auto; min-height: 812px; position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .body { padding: 6px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--coral); }
  h1 { margin: -4px 0 0; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 56px; line-height: 0.95; letter-spacing: -0.01em; }
  h1 em { color: var(--teal); }
  .lede { margin: 0; font-size: 15px; line-height: 1.45; color: #3b4660; }
  .ticket { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 4px; background: #fff8ea; position: relative; }
  .ticket::before, .ticket::after { content: ''; position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
  .ticket::before { left: -10px; clip-path: inset(0 0 0 50%); } .ticket::after { right: -10px; clip-path: inset(0 50% 0 0); }
  .ticket small { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b7286; }
  .ticket .tier { font-family: 'DM Serif Display', serif; font-size: 28px; color: #7d35c9; grid-column: 1; }
  .ticket .pts { grid-column: 2; grid-row: 1 / span 2; font-family: 'DM Serif Display', serif; font-size: 34px; }
  .btn { display: block; text-align: center; padding: 16px; border-radius: 999px; background: var(--coral); color: #fff; font-weight: 700; font-size: 17px; letter-spacing: 0.04em; box-shadow: 0 3px 0 var(--ink); border: 2px solid var(--ink); }
</style>
</head>
<body>
<div class="phone">
  <svg viewBox="0 0 375 430" id="scene" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4845f" /><stop offset="0.55" stop-color="#f7a072" /><stop offset="1" stop-color="#fbd1a2" /></linearGradient>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" /><feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.16  0 0 0 0 0.27  0 0 0 0.22 0" /><feComposite in2="SourceGraphic" operator="in" /></filter>
      <clipPath id="sunclip"><rect x="0" y="0" width="375" height="168" /></clipPath>
      <mask id="stripes"><rect width="375" height="430" fill="#fff" /><rect x="0" y="138" width="375" height="4" fill="#000" /><rect x="0" y="148" width="375" height="6" fill="#000" /><rect x="0" y="160" width="375" height="8" fill="#000" /></mask>
    </defs>
    <rect width="375" height="430" fill="url(#sky)" />
    <g clip-path="url(#sunclip)" mask="url(#stripes)"><circle cx="232" cy="158" r="78" fill="#fde4a5" /></g>
    <!-- birds -->
    <path d="M70 70 q6 -6 12 0 q6 -6 12 0 M104 92 q5 -5 10 0 q5 -5 10 0" fill="none" stroke="#1d2a44" stroke-width="2" stroke-linecap="round" />
    <!-- sea -->
    <rect y="166" width="375" height="90" fill="#1f7a80" />
    <g fill="#fde4a5" opacity="0.85"><rect x="196" y="174" width="72" height="3" rx="1.5" /><rect x="206" y="184" width="52" height="3" rx="1.5" /><rect x="216" y="194" width="32" height="3" rx="1.5" /><rect x="224" y="204" width="16" height="3" rx="1.5" /></g>
    <path d="M20 190 h34 M60 214 h22 M120 200 h40 M300 222 h40" stroke="#7fc2bf" stroke-width="3" stroke-linecap="round" />
    <!-- sailboat -->
    <path d="M118 176 l0 -34 l22 30 z" fill="#f6ecd8" stroke="#1d2a44" stroke-width="2" stroke-linejoin="round" /><path d="M104 178 h40 l-6 8 h-28 z" fill="#c8553d" stroke="#1d2a44" stroke-width="2" stroke-linejoin="round" />
    <!-- headland with the yellow house -->
    <path d="M196 214 C 230 186, 280 176, 330 172 C 352 170, 368 172, 375 171 L375 430 L196 430 Z" fill="#9caf5a" />
    <g stroke="#1d2a44" stroke-width="2" stroke-linejoin="round">
      <rect x="278" y="140" width="52" height="38" fill="#f2c14e" />
      <path d="M270 142 L304 112 L338 142 Z" fill="#c8553d" />
      <rect x="298" y="156" width="12" height="22" fill="#1f7a80" />
      <rect x="284" y="150" width="9" height="10" fill="#fff8ea" /><rect x="315" y="150" width="9" height="10" fill="#fff8ea" />
      <rect x="318" y="114" width="7" height="14" fill="#c8553d" />
    </g>
    <!-- hills -->
    <path d="M0 238 C 70 214, 150 246, 230 228 C 290 214, 340 228, 375 220 L375 430 L0 430 Z" fill="#8aa04b" />
    <path d="M0 300 C 90 276, 200 312, 375 286 L375 430 L0 430 Z" fill="#6f8f3d" />
    <path d="M0 362 C 100 340, 230 376, 375 352 L375 430 L0 430 Z" fill="#4f6f2d" />
    <!-- trail -->
    <path id="trail" d="M70 392 C 160 402, 320 396, 312 356 C 305 322, 120 334, 92 300 C 70 272, 250 280, 274 250 C 292 226, 170 232, 190 210 C 204 194, 260 196, 296 180" fill="none" />
    <use href="#trail" stroke="#1d2a44" stroke-width="17" stroke-linecap="round" />
    <use href="#trail" stroke="#f6e7c8" stroke-width="12" stroke-linecap="round" />
    <use href="#trail" stroke="#d9b679" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" />
    <g id="palms"></g>
    <g id="stops"></g>
    <!-- cart -->
    <g stroke="#1d2a44" stroke-width="2" stroke-linejoin="round">
      <path d="M66 388 L92 396" fill="none" stroke-width="3" stroke-linecap="round" />
      <rect x="14" y="366" width="54" height="22" rx="2" fill="#c27a3e" />
      <path d="M28 366 v22 M42 366 v22 M56 366 v22" fill="none" />
      <circle cx="28" cy="394" r="11" fill="#e2a861" /><circle cx="56" cy="394" r="11" fill="#e2a861" />
      <path d="M17 394 h22 M28 383 v22 M45 394 h22 M56 383 v22" fill="none" />
    </g>
    <g id="walker"></g>
    <rect width="375" height="430" filter="url(#grain)" opacity="0.9" />
  </svg>
  <div class="body">
    <span class="kicker">Dal carro alla casa gialla</span>
    <h1>Park<em>Flung</em></h1>
    <p class="lede">Cinque domande. Più la tua risposta è rara, più strada fai lungo il sentiero.</p>
    <div class="ticket"><small>Hai detto «corbezzolo»</small><span class="tier">Jonny 🍆</span><span class="pts">+75</span></div>
    <span class="btn">Parti dal carro</span>
  </div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg'
const el = (tag, attrs, parent) => { const node = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v)); parent.appendChild(node); return node }
const trail = document.getElementById('trail'), total = trail.getTotalLength()
// Stops every 100 points: poster-style roundels
;[1, 2, 3, 4].forEach((n) => { const p = trail.getPointAtLength(total * n / 5), g = el('g', { transform: `translate(${p.x} ${p.y - 22})` }, document.getElementById('stops')); el('path', { d: 'M0 10 V22', stroke: '#1d2a44', 'stroke-width': 2 }, g); el('circle', { r: 11, fill: n === 1 ? '#e8664a' : '#fff8ea', stroke: '#1d2a44', 'stroke-width': 2 }, g); const t = el('text', { y: 4, 'text-anchor': 'middle', 'font-family': 'DM Serif Display', 'font-size': 11, fill: n === 1 ? '#fff' : '#1d2a44' }, g); t.textContent = n * 100 })
// Palms as ink silhouettes
function palm(x, y, s, flip) { const g = el('g', { transform: `translate(${x} ${y}) scale(${flip ? -s : s} ${s})` }, document.getElementById('palms')); el('path', { d: 'M0 0 C -3 -20, 4 -40, 2 -58', fill: 'none', stroke: '#2f3d2a', 'stroke-width': 5, 'stroke-linecap': 'round' }, g); ['M2 -58 C -12 -66, -28 -62, -36 -50 C -24 -56, -12 -56, 2 -58 Z', 'M2 -58 C 14 -70, 32 -66, 40 -54 C 28 -60, 16 -60, 2 -58 Z', 'M2 -58 C -6 -76, -22 -82, -34 -78 C -22 -74, -10 -68, 2 -58 Z', 'M2 -58 C 10 -78, 26 -84, 38 -80 C 26 -76, 14 -70, 2 -58 Z', 'M2 -58 C 0 -74, 6 -86, 14 -90 C 10 -78, 8 -68, 2 -58 Z'].forEach((d) => el('path', { d, fill: '#2f3d2a' }, g)) }
palm(40, 270, 0.85); palm(348, 318, 1.05, true); palm(222, 330, 0.7); palm(352, 172, 0.55); palm(214, 196, 0.45, true)
// The walker: both hands on the stem, a big frond arching over his head
function walker(x, y, s) {
  const g = el('g', { transform: `translate(${x} ${y}) scale(${s})` }, document.getElementById('walker'))
  el('ellipse', { cx: 0, cy: 1, rx: 12, ry: 3, fill: 'rgba(29,42,68,0.25)' }, g)
  const ink = { stroke: '#1d2a44', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }
  el('path', { d: 'M-3 -18 L-6 0 M3 -18 L6 0', fill: 'none', ...ink, 'stroke-width': 4.5 }, g)
  el('path', { d: 'M-8 -40 Q0 -45 8 -40 L7 -17 H-7 Z', fill: '#fff8ea', ...ink }, g)
  el('path', { d: 'M-8 -40 Q0 -45 8 -40 L7.5 -32 H-7.5 Z', fill: '#e8664a', ...ink }, g)
  // Frond: stem from the hands, then a curved midrib with leaflets on both sides
  const P0 = [9, -30], C = [26, -78], P2 = [-14, -86]
  const pt = (t) => [(1 - t) ** 2 * P0[0] + 2 * (1 - t) * t * C[0] + t * t * P2[0], (1 - t) ** 2 * P0[1] + 2 * (1 - t) * t * C[1] + t * t * P2[1]]
  for (let t = 0.22; t <= 1; t += 0.045) { const [x0, y0] = pt(t), [x1, y1] = pt(Math.min(1, t + 0.01)); const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, L = 15 * (1 - t * 0.55); [1, -1].forEach((side) => el('path', { d: `M${x0} ${y0} Q ${x0 + nx * side * L * 0.6 + dx / len * 3} ${y0 + ny * side * L * 0.6 + dy / len * 3} ${x0 + nx * side * L + dx / len * 6} ${y0 + ny * side * L + dy / len * 6}`, fill: 'none', stroke: '#3f7d2c', 'stroke-width': 3.2, 'stroke-linecap': 'round' }, g)) }
  el('path', { d: `M${P0[0]} ${P0[1] + 10} L${P0[0]} ${P0[1]} Q ${C[0]} ${C[1]} ${P2[0]} ${P2[1]}`, fill: 'none', stroke: '#1d2a44', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, g)
  // Arms reaching to the stem
  el('path', { d: 'M-6 -36 Q 0 -28 8 -26 M6 -37 Q 9 -33 9 -31', fill: 'none', stroke: '#1d2a44', 'stroke-width': 6, 'stroke-linecap': 'round' }, g)
  el('path', { d: 'M-6 -36 Q 0 -28 8 -26 M6 -37 Q 9 -33 9 -31', fill: 'none', stroke: '#f1c9a0', 'stroke-width': 3.4, 'stroke-linecap': 'round' }, g)
  el('circle', { cx: 0, cy: -50, r: 7.5, fill: '#f1c9a0', ...ink }, g)
  el('path', { d: 'M-7.5 -52 Q -6 -60 0 -59 Q 7 -59 7.5 -52 Q 3 -55 -7.5 -52 Z', fill: '#1d2a44' }, g)
}
walker(118, 396, 1.15)
</script>
</body>
</html>
